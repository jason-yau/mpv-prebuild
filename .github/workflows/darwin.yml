name: Darwin

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ""
      target:
        type: string
        required: false
        default: "macos-universal"
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: false
        default: ""
      target:
        type: choice
        default: macos-universal
        options: [macos-universal, macos-arm64, ios-arm64]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo-c
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.rustup
          key: rust-c-${{ runner.os }}-${{ runner.arch }}

      - name: Host packages
        run: |
          brew install cmake meson ninja pkg-config nasm automake autoconf libtool
          python3 -m pip install --user jinja2 \
            || python3 -m pip install --user --break-system-packages jinja2

      - name: Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          echo "XCODE_PATH=$XCODE" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Cache sources
        uses: actions/cache@v4
        with:
          path: |
            work/download
            work/src
          key: src-${{ hashFiles('config/versions.env') }}

      - name: Build
        run: |
          case "${{ inputs.target }}" in
            macos-universal) bash ./scripts/build.sh --os macos --arch universal --flavor all ;;
            macos-arm64)     bash ./scripts/build.sh --os macos --arch arm64 --flavor all ;;
            ios-arm64)       bash ./scripts/build.sh --os ios --arch arm64 --flavor all ;;
            *) echo "unknown target ${{ inputs.target }}" >&2; exit 1 ;;
          esac

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-${{ inputs.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
