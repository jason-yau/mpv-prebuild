name: iOS

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ""
      arch:
        type: string
        required: false
        default: "arm64"
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: false
        default: ""
      arch:
        type: choice
        default: arm64
        options: [arm64, simulator-arm64, simulator-x86_64, all]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Cache cargo-c
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.rustup
          key: rust-c-${{ runner.os }}-${{ runner.arch }}

      - name: Host packages
        run: |
          brew install cmake meson ninja pkg-config nasm automake autoconf libtool
          python3 -m pip install --user jinja2 \
            || python3 -m pip install --user --break-system-packages jinja2

      - name: Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          echo "XCODE_PATH=$XCODE" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Cache sources
        uses: actions/cache@v5
        with:
          path: |
            work/download
            work/src
          key: src-${{ hashFiles('config/versions.env') }}

      - name: Build
        run: |
          set -euo pipefail
          v="${VERSION:-}"
          if [ -z "$v" ]; then
            v="$(date -u +%Y%m%d%H%M%S)"
          fi
          export VERSION="$v"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          case "${{ inputs.arch }}" in
            arm64)
              bash ./scripts/build.sh --os ios --arch arm64 --flavor all
              ;;
            simulator-arm64)
              bash ./scripts/build.sh --os iossimulator --arch arm64 --flavor all
              ;;
            simulator-x86_64)
              bash ./scripts/build.sh --os iossimulator --arch x86_64 --flavor all
              ;;
            all)
              bash ./scripts/build.sh --os ios --arch arm64 --flavor all
              bash ./scripts/build.sh --os iossimulator --arch arm64 --flavor all
              ;;
            *)
              echo "unknown ios arch ${{ inputs.arch }}" >&2
              exit 1
              ;;
          esac

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: libmpv-ios-${{ inputs.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
