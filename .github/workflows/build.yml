name: Build libmpv

on:
  workflow_dispatch:
    inputs:
      version:
        description: Artifact version label (empty = <mpv>-<UTC timestamp>)
        required: false
        type: string
        default: ""
      platforms:
        description: Platforms to build
        required: true
        type: choice
        default: all
        options:
          - all
          - windows
          - android
          - macos
          - ios
          - darwin
          - linux
          - ubuntu
      windows_arch:
        description: Windows architecture
        type: choice
        default: x86_64
        options:
          - x86_64
          - arm64
          - all
      android_arch:
        description: Android architecture
        type: choice
        default: arm64
        options:
          - all
          - arm64
          - armv7
          - x86
          - x86_64
      macos_arch:
        description: macOS architecture
        type: choice
        default: universal
        options:
          - universal
          - arm64
      ios_arch:
        description: iOS architecture (arm64 = device)
        type: choice
        default: arm64
        options:
          - arm64
          - simulator-arm64
          - simulator-x86_64
          - all
      linux_arch:
        description: Linux architecture
        type: choice
        default: all
        options:
          - all
          - x86_64
          - arm64
      publish:
        description: Publish a GitHub Release
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: set
        name: Resolve version label
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          else
            v="$(date -u +%Y%m%d%H%M%S)"
          fi
          if [ -z "$v" ]; then
            echo "refusing empty version label" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Using version $v"

  windows:
    needs: [version]
    if: >-
      github.event_name == 'push' ||
      inputs.platforms == 'all' ||
      inputs.platforms == 'windows'
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ needs.version.outputs.version }}
      arch: ${{ github.event_name == 'push' && 'x86_64' || inputs.windows_arch }}

  android:
    needs: [version]
    if: >-
      github.event_name == 'push' ||
      inputs.platforms == 'all' ||
      inputs.platforms == 'android'
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.version.outputs.version }}
      arch: ${{ github.event_name == 'push' && 'all' || inputs.android_arch }}

  macos:
    needs: [version]
    if: >-
      github.event_name == 'push' ||
      inputs.platforms == 'all' ||
      inputs.platforms == 'macos' ||
      inputs.platforms == 'darwin'
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ needs.version.outputs.version }}
      arch: ${{ github.event_name == 'push' && 'universal' || inputs.macos_arch }}

  ios:
    needs: [version]
    if: >-
      github.event_name == 'push' ||
      inputs.platforms == 'all' ||
      inputs.platforms == 'ios' ||
      inputs.platforms == 'darwin'
    uses: ./.github/workflows/ios.yml
    with:
      version: ${{ needs.version.outputs.version }}
      arch: ${{ github.event_name == 'push' && 'arm64' || inputs.ios_arch }}

  linux:
    needs: [version]
    if: >-
      github.event_name == 'push' ||
      inputs.platforms == 'all' ||
      inputs.platforms == 'linux' ||
      inputs.platforms == 'ubuntu'
    uses: ./.github/workflows/linux.yml
    with:
      version: ${{ needs.version.outputs.version }}
      arch: ${{ github.event_name == 'push' && 'all' || inputs.linux_arch }}

  release:
    needs: [version, windows, android, macos, ios, linux]
    if: >-
      always() &&
      !cancelled() &&
      needs.version.result == 'success' &&
      (github.event_name == 'push' || inputs.publish) &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped') &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
      (needs.windows.result == 'success' ||
       needs.android.result == 'success' ||
       needs.macos.result == 'success' ||
       needs.ios.result == 'success' ||
       needs.linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
          pattern: libmpv-*
      - name: List artifacts
        run: find dist -type f | sort
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
          fail_on_unmatched_files: false
