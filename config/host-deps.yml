# Host packages required to compile libmpv.
# CI installs these; use the same list locally.

ubuntu:
  - build-essential
  - cmake
  - meson
  - ninja-build
  - pkg-config
  - python3
  - python3-pip
  - python3-jinja2
  - nasm
  - yasm
  - curl
  - unzip
  - zip
  - autoconf
  - automake
  - libtool
  - libegl1-mesa-dev
  - libgl1-mesa-dev
  - libasound2-dev
  - libpulse-dev
  - libpipewire-0.3-dev
  - libx11-dev
  - libxext-dev
  - libxinerama-dev
  - libxrandr-dev
  - libxpresent-dev
  - libxss-dev
  - libxfixes-dev
  - libxkbcommon-dev
  - libva-dev
  - libvdpau-dev
  - libwayland-dev
  - wayland-protocols
  - libffi-dev
  - libdrm-dev
  - libgbm-dev
  - libjack-jackd2-dev
  - libsndio-dev
  - patchelf
  - hwdata
  notes: |
    Prefer `pip3 install meson ninja` if distro meson < 1.3 (libplacebo requires Meson >= 1.3).
    Windows builds also need llvm-mingw (see config/versions.env). shaderc uses Python at configure time.
    Vulkan-Loader (Linux) needs X11/XCB/Xrandr pkg-config from the desktop -dev list below.
    Vulkan / Dolby Vision / lcms2 need a Rust toolchain (`rustup`) and `cargo-c` (installed by the build if missing). `libssl-dev` is used when compiling cargo-c.
    Android builds need an NDK matching ANDROID_NDK_VERSION.
    The desktop -dev packages (GL, audio, X11/Wayland, DRM/GBM, VA-API, VDPAU) are only required for native Linux builds.
    `patchelf` is required when packaging Linux SDKs (sets `$ORIGIN` on bundled .so files).
    `hwdata` provides `/usr/share/hwdata/pnp.ids` at build time for libdisplay-info (vendored; Ubuntu 22.04 has no libdisplay-info-dev).
    `libffi-dev` is required when vendoring libwayland on Ubuntu 22.04 (distro wayland 1.20 is too old for mpv 0.41).
    mpv 0.41 X11 / VDPAU / JACK are GPL-only; lgpl Linux builds omit them.
    Native PipeWire needs libpipewire-0.3-dev. Ubuntu 22.04 ships 0.3.48; mpv 0.41
    is patched at build time to accept that (upstream meson wants >= 0.3.57).
    python3-jinja2 is required to configure libplacebo.

macos:
  - cmake
  - meson
  - ninja
  - pkg-config
  - nasm
  - automake
  - autoconf
  - libtool
  notes: Xcode + CLT required. brew install cmake meson ninja pkg-config nasm. libplacebo also needs Python Jinja2 (`pip3 install jinja2`). Vulkan/Dolby Vision need rustup + cargo-c (the build installs them if missing).
